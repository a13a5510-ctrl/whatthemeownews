<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵逮雞 ERP - 系統管理中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --primary: #6366f1; --border: #e2e8f0; --success: #10b981;}
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --primary: #818cf8; --border: #334155; --success: #34d399;}

        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; transition: all 0.3s ease; height: 100vh; overflow: hidden; }

        /* --- 側邊欄 --- */
        .sidebar { width: 260px; height: 100vh; background: var(--card); border-right: 1px solid var(--border); padding: 24px; box-sizing: border-box; flex-shrink: 0;}
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 40px; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: 0.2s; font-weight: 600; color: var(--text); opacity: 0.7; }
        .nav-item:hover { opacity: 1; background: rgba(99, 102, 241, 0.1); }
        .nav-item.active { background: var(--primary); color: white; opacity: 1; }

        /* --- 主內容區 --- */
        .main-content { flex: 1; padding: 40px; max-width: 1200px; overflow-y: auto; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-actions h2 { margin: 0; }
        
        .btn-group { display: flex; gap: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-sizing: border-box; }

        .quick-add-box { background: var(--bg); padding: 16px; border-radius: 12px; border: 1px dashed var(--primary); margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        .quick-add-box input { padding: 8px; font-size: 13px; }

        .bom-list { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
        .bom-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .bom-item input[type="number"] { width: 80px; }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; padding: 8px 16px; }
        .btn-theme { background: var(--border); color: var(--text); }
        
        .real-time-preview { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .page-section { display: none; animation: fadeIn 0.3s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           自動適應 (iPad 與 手機真實環境)
           ========================================= */
        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; } /* iPad 直立時自動變單排 */
            .main-content { padding: 24px; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 100; border-right: none; border-bottom: 1px solid var(--border); padding: 12px; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; align-items: center;}
            .logo { margin-bottom: 0; margin-right: 16px; font-size: 18px; white-space: nowrap; }
            .nav-item { margin-bottom: 0; white-space: nowrap; padding: 8px 12px; font-size: 14px;}
            .main-content { padding: 16px; overflow-y: visible;}
            .header-actions { flex-direction: column; align-items: flex-start; gap: 16px; }
            .btn-group { width: 100%; display: flex; }
            .btn-group .btn { flex: 1; }
            .quick-add-box input { flex: 1 1 100%; } /* 手機上輸入框換行 */
        }

        /* =========================================
           電腦端的「模擬手機」預覽模式 (模擬 iPhone 17 Pro 寬度)
           ========================================= */
        body.simulate-mobile {
            max-width: 393px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
            flex-direction: column;
            overflow-y: auto;
            height: 100vh;
        }
        body.simulate-mobile .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 100; border-right: none; border-bottom: 1px solid var(--border); padding: 12px; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; align-items: center;}
        body.simulate-mobile .logo { display: none; } /* 手機預覽時隱藏大 Logo 節省空間 */
        body.simulate-mobile .nav-item { margin-bottom: 0; white-space: nowrap; padding: 8px 12px; font-size: 14px;}
        body.simulate-mobile .grid { grid-template-columns: 1fr; }
        body.simulate-mobile .main-content { padding: 16px; overflow-y: visible;}
        body.simulate-mobile .header-actions { flex-direction: column; align-items: stretch; gap: 12px; }
        body.simulate-mobile .header-actions h2 { font-size: 20px; }
        body.simulate-mobile .btn-group { display: flex; gap: 8px; width: 100%; }
        body.simulate-mobile .btn-group .btn { flex: 1; padding: 8px; font-size: 13px;}
        body.simulate-mobile .quick-add-box input { flex: 1 1 100%; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">🐱 喵逮雞 ERP</div>
    <div class="nav-item active" onclick="switchPage('products', this)">品項管理 (11)</div>
    <div class="nav-item" onclick="switchPage('inventory', this)">內餡/庫存管理</div>
    <div class="nav-item" onclick="switchPage('suppliers', this)">供應商管理</div>
    <div class="nav-item" onclick="switchPage('reports', this)">報表分析</div>
</div>

<div class="main-content">
    <div class="header-actions">
        <h2 id="pageTitle">🛠️ 產品配方建檔中心</h2>
        <div class="btn-group">
            <button class="btn btn-theme" id="mobileToggleBtn" onclick="toggleMobileView()">📱 手機預覽</button>
            <button class="btn btn-theme" onclick="toggleTheme()">🌓 切換模式</button>
        </div>
    </div>

    <div id="page-products" class="page-section active">
        <div class="grid">
            <div class="card">
                <h3>🆕 新增/修改品項</h3>
                <div class="form-group"><label>口味名稱</label><input type="text" id="prodName" placeholder="例如：珍珠卡士達"></div>
                <div class="form-group"><label>預計售價 ($)</label><input type="number" id="prodPrice" value="40" oninput="calculateRealTime()"></div>
                
                <label>📦 配方配置 (庫存清單)</label>
                <div class="quick-add-box">
                    <div style="width: 100%; font-size: 13px; font-weight: bold; color: var(--text); opacity: 0.8;">✨ 找不到材料？立刻建檔：</div>
                    <input type="text" id="newMatName" placeholder="名稱 (如: 珍珠)" style="flex: 2;">
                    <input type="text" id="newMatUnit" placeholder="單位 (如: 克)" style="flex: 1;">
                    <input type="number" id="newMatCost" placeholder="成本/單位" style="flex: 1;" step="0.1">
                    <button class="btn btn-success" onclick="quickAddMaterial()">➕ 新增材料</button>
                </div>

                <div class="bom-list" id="bomList">載入中...</div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="saveProduct()">💾 儲存此口味與配方</button>
            </div>
            <div class="card">
                <h3>📈 獲利即時預覽</h3>
                <div class="real-time-preview">
                    <div style="font-size: 14px; opacity: 0.9;">預計總食材成本</div>
                    <div style="font-size: 32px; font-weight: 900;" id="totalCost">$0.0</div>
                    <hr style="opacity: 0.3; margin: 15px 0;">
                    <div style="font-size: 14px; opacity: 0.9;">預計單份毛利</div>
                    <div style="font-size: 24px; font-weight: 900;" id="grossProfit">$0.0</div>
                </div>
            </div>
        </div>
    </div>

    <div id="page-inventory" class="page-section"><div class="card"><h3>📦 倉庫管理 (建置中)</h3></div></div>
    <div id="page-suppliers" class="page-section"><div class="card"><h3>🚚 供應商管理 (建置中)</h3></div></div>
    <div id="page-reports" class="page-section"><div class="card"><h3>📊 報表分析 (建置中)</h3></div></div>
</div>

<script>
    const API_URL = "https://whatthemeownews-erp-backend-324921111026.europe-west1.run.app";
    let materials = [];

    function switchPage(pageId, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.getElementById('pageTitle').textContent = "🛠️ " + element.textContent;
    }

    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', theme);
    }

    // 🌟 新增：切換手機預覽模式的魔法
    function toggleMobileView() {
        document.body.classList.toggle('simulate-mobile');
        const btn = document.getElementById('mobileToggleBtn');
        if (document.body.classList.contains('simulate-mobile')) {
            btn.textContent = '💻 電腦模式';
        } else {
            btn.textContent = '📱 手機預覽';
        }
    }

    async function loadMaterials() {
        const currentState = {};
        document.querySelectorAll('.bom-item').forEach(item => {
            const checkbox = item.querySelector('.mat-check');
            const qty = item.querySelector('.mat-qty').value;
            if (checkbox && checkbox.checked) {
                currentState[checkbox.dataset.id] = qty;
            }
        });

        try {
            const res = await fetch(`${API_URL}/api/inventory`);
            const result = await res.json();
            materials = result.data;
            const container = document.getElementById('bomList');
            
            if(materials.length === 0) {
                container.innerHTML = "尚未建檔任何材料，請由上方快速新增！";
                return;
            }
            
            container.innerHTML = materials.map(m => `
                <div class="bom-item">
                    <input type="checkbox" class="mat-check" data-id="${m.id}" data-cost="${m.unit_cost}" onchange="calculateRealTime()">
                    <span style="flex: 1; font-weight: bold; color: var(--primary);">${m.name}</span>
                    <input type="number" class="mat-qty" placeholder="用量" step="0.1" data-id="${m.id}" oninput="calculateRealTime()">
                    <small style="color: var(--text); opacity: 0.6;">${m.unit}</small>
                </div>
            `).join('');

            document.querySelectorAll('.bom-item').forEach(item => {
                const checkbox = item.querySelector('.mat-check');
                const qtyInput = item.querySelector('.mat-qty');
                if (currentState[checkbox.dataset.id] !== undefined) {
                    checkbox.checked = true;
                    qtyInput.value = currentState[checkbox.dataset.id];
                }
            });
            calculateRealTime();
        } catch (e) { console.error("載入失敗", e); }
    }

    async function quickAddMaterial() {
        const name = document.getElementById('newMatName').value.trim();
        const unit = document.getElementById('newMatUnit').value.trim();
        const unit_cost = parseFloat(document.getElementById('newMatCost').value);

        if(!name || !unit || isNaN(unit_cost)) return alert("請填寫完整的材料名稱、單位與成本！");

        const btn = document.querySelector('.quick-add-box .btn-success');
        btn.textContent = "⏳ 新增中...";

        try {
            const res = await fetch(`${API_URL}/api/materials`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, unit, unit_cost })
            });
            const result = await res.json();
            
            if(result.status === 'success') {
                document.getElementById('newMatName').value = '';
                document.getElementById('newMatUnit').value = '';
                document.getElementById('newMatCost').value = '';
                await loadMaterials();
            } else {
                alert(result.message);
            }
        } catch (e) {
            alert("新增失敗，請檢查網路連線！");
        } finally {
            btn.textContent = "➕ 新增材料";
        }
    }

    function calculateRealTime() {
        let totalCost = 0;
        const price = parseFloat(document.getElementById('prodPrice').value) || 0;
        document.querySelectorAll('.bom-item').forEach(item => {
            const checkbox = item.querySelector('.mat-check');
            const qtyInput = item.querySelector('.mat-qty');
            if (checkbox.checked) {
                totalCost += (parseFloat(checkbox.dataset.cost) * (parseFloat(qtyInput.value) || 0));
            }
        });
        document.getElementById('totalCost').textContent = `$${totalCost.toFixed(2)}`;
        document.getElementById('grossProfit').textContent = `$${(price - totalCost).toFixed(2)}`;
    }

    async function saveProduct() {
        const name = document.getElementById('prodName').value.trim();
        const price = parseInt(document.getElementById('prodPrice').value);
        if(!name) return alert("請輸入口味名稱！");

        const recipes = [];
        document.querySelectorAll('.bom-item').forEach(item => {
            const checkbox = item.querySelector('.mat-check');
            if (checkbox.checked) {
                recipes.push({
                    material_id: parseInt(checkbox.dataset.id),
                    consume_qty: parseFloat(item.querySelector('.mat-qty').value) || 0
                });
            }
        });
        if(recipes.length === 0) return alert("請至少勾選一項材料作為配方！");
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, recipes })
            });
            const result = await res.json();
            alert(result.message);
            
            if(result.status === 'success') {
                document.getElementById('prodName').value = '';
                document.querySelectorAll('.mat-check').forEach(cb => cb.checked = false);
                document.querySelectorAll('.mat-qty').forEach(qty => qty.value = '');
                calculateRealTime();
            }
        } catch (e) { alert("儲存失敗"); }
    }

    window.onload = loadMaterials;
</script>

</body>
</html>
