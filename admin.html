<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵逮雞 ERP - 系統管理中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --primary: #6366f1; --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --primary: #818cf8; --border: #334155;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; display: flex; transition: all 0.3s ease; height: 100vh; overflow: hidden;
        }

        /* --- 側邊欄 --- */
        .sidebar {
            width: 260px; height: 100vh; background: var(--card); border-right: 1px solid var(--border);
            padding: 24px; box-sizing: border-box;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 40px; }
        .nav-item {
            padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 8px;
            transition: 0.2s; font-weight: 600; color: var(--text); opacity: 0.7;
        }
        .nav-item:hover { opacity: 1; background: rgba(99, 102, 241, 0.1); }
        .nav-item.active { background: var(--primary); color: white; opacity: 1; }

        /* --- 主內容區 --- */
        .main-content { flex: 1; padding: 40px; max-width: 1200px; overflow-y: auto; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
        input, select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); box-sizing: border-box;
        }

        .bom-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
        .bom-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .bom-item input[type="number"] { width: 80px; }

        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-theme { background: var(--border); color: var(--text); }
        
        .real-time-preview { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        
        /* 隱藏未啟用的頁面 */
        .page-section { display: none; animation: fadeIn 0.3s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">🐱 喵逮雞 ERP</div>
    <div class="nav-item active" onclick="switchPage('products', this)">品項管理 (11)</div>
    <div class="nav-item" onclick="switchPage('inventory', this)">內餡/庫存管理</div>
    <div class="nav-item" onclick="switchPage('suppliers', this)">供應商管理</div>
    <div class="nav-item" onclick="switchPage('reports', this)">報表分析</div>
</div>

<div class="main-content">
    <div class="header-actions">
        <h2 id="pageTitle">🛠️ 產品配方建檔中心</h2>
        <button class="btn btn-theme" onclick="toggleTheme()">🌓 切換模式</button>
    </div>

    <div id="page-products" class="page-section active">
        <div class="grid">
            <div class="card">
                <h3>🆕 新增/修改品項</h3>
                <div class="form-group"><label>口味名稱</label><input type="text" id="prodName" placeholder="例如：起司大叔"></div>
                <div class="form-group"><label>預計售價 ($)</label><input type="number" id="prodPrice" value="35"></div>
                <label>配方配置 (勾選下方材料並輸入消耗量)</label>
                <div class="bom-list" id="bomList">載入中...</div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="saveProduct()">💾 儲存口味與配方</button>
            </div>
            <div class="card">
                <h3>📈 獲利即時預覽</h3>
                <div class="real-time-preview">
                    <div style="font-size: 14px; opacity: 0.9;">預計總食材成本</div>
                    <div style="font-size: 32px; font-weight: 900;" id="totalCost">$0.0</div>
                    <hr style="opacity: 0.3; margin: 15px 0;">
                    <div style="font-size: 14px; opacity: 0.9;">預計單份毛利</div>
                    <div style="font-size: 24px; font-weight: 900;" id="grossProfit">$0.0</div>
                </div>
            </div>
        </div>
    </div>

    <div id="page-inventory" class="page-section">
        <div class="card">
            <h3>📦 倉庫與內餡管理</h3>
            <p>老闆，這裡未來可以讓您手動新增「珍珠、紅豆、牽絲起司」等 15 種內餡的庫存與成本！</p>
            <p style="color: var(--text); opacity: 0.5;">(模組建置中...)</p>
        </div>
    </div>

    <div id="page-suppliers" class="page-section">
        <div class="card">
            <h3>🚚 供應商通訊錄</h3>
            <p>記下送蛋阿伯和麵粉廠的聯絡方式與結帳週期。</p>
            <p style="color: var(--text); opacity: 0.5;">(模組建置中...)</p>
        </div>
    </div>

    <div id="page-reports" class="page-section">
        <div class="card">
            <h3>📊 深度報表分析</h3>
            <p>與 dashboard.html 聯動，查看每週熱銷排行與毛利金牛！</p>
            <p style="color: var(--text); opacity: 0.5;">(模組建置中...)</p>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://whatthemeownews-erp-backend-324921111026.europe-west1.run.app";
    let materials = [];

    // 🌟 新增：切換頁面的 JavaScript 魔法
    function switchPage(pageId, element) {
        // 1. 把所有左側按鈕的 active 狀態拿掉
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        // 2. 幫目前點擊的按鈕加上 active (亮起來)
        element.classList.add('active');
        
        // 3. 把所有內容頁面隱藏
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        // 4. 顯示對應的內容頁面
        document.getElementById('page-' + pageId).classList.add('active');

        // 5. 順便換一下大標題
        document.getElementById('pageTitle').textContent = "🛠️ " + element.textContent;
    }

    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', theme);
    }

    async function loadMaterials() {
        try {
            const res = await fetch(`${API_URL}/api/inventory`);
            const result = await res.json();
            materials = result.data;
            const container = document.getElementById('bomList');
            if(materials.length === 0) {
                container.innerHTML = "尚未建檔任何材料，請先檢查後端！";
                return;
            }
            container.innerHTML = materials.map(m => `
                <div class="bom-item">
                    <input type="checkbox" class="mat-check" data-id="${m.id}" data-cost="${m.unit_cost}" onchange="calculateRealTime()">
                    <span style="flex: 1">${m.name}</span>
                    <input type="number" class="mat-qty" placeholder="用量" step="0.1" data-id="${m.id}" oninput="calculateRealTime()">
                    <small>${m.unit}</small>
                </div>
            `).join('');
        } catch (e) { console.error("載入失敗", e); }
    }

    function calculateRealTime() {
        let totalCost = 0;
        const price = parseFloat(document.getElementById('prodPrice').value) || 0;
        document.querySelectorAll('.bom-item').forEach(item => {
            const checkbox = item.querySelector('.mat-check');
            const qtyInput = item.querySelector('.mat-qty');
            if (checkbox.checked) {
                totalCost += (parseFloat(checkbox.dataset.cost) * (parseFloat(qtyInput.value) || 0));
            }
        });
        document.getElementById('totalCost').textContent = `$${totalCost.toFixed(2)}`;
        document.getElementById('grossProfit').textContent = `$${(price - totalCost).toFixed(2)}`;
    }

    async function saveProduct() {
        const name = document.getElementById('prodName').value;
        const price = parseInt(document.getElementById('prodPrice').value);
        const recipes = [];
        document.querySelectorAll('.bom-item').forEach(item => {
            const checkbox = item.querySelector('.mat-check');
            if (checkbox.checked) {
                recipes.push({
                    material_id: parseInt(checkbox.dataset.id),
                    consume_qty: parseFloat(item.querySelector('.mat-qty').value) || 0
                });
            }
        });
        if(recipes.length === 0) return alert("請至少勾選一項材料作為配方！");
        
        try {
            const res = await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, recipes })
            });
            const result = await res.json();
            alert(result.message);
        } catch (e) { alert("儲存失敗"); }
    }

    window.onload = loadMaterials;
</script>

</body>
</html>
