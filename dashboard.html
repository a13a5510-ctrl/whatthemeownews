<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵逮雞 ERP - 老闆戰情室</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --primary: #3f51b5;
            --success: #4CAF50;
            --danger: #f44336;
            --warning: #ff9800;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            margin: 0;
            color: var(--primary);
            font-weight: 900;
        }

        .refresh-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* --- 數據卡片區 --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            border-left: 5px solid var(--primary);
        }
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.danger { border-left-color: var(--danger); }

        .stat-title {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 900;
            margin: 0;
        }
        .stat-card.success .stat-value { color: var(--success); }
        .stat-card.danger .stat-value { color: var(--danger); }

        /* --- 圖表與表格區 --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-main);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* --- 表格樣式 --- */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f9f9f9;
            color: var(--text-muted);
            font-weight: bold;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge.paid { background-color: var(--success); }
        .badge.unpaid { background-color: var(--danger); }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>📊 喵逮雞 ERP 戰情室</h1>
        <button class="refresh-btn" onclick="fetchDashboardData()">🔄 重新整理</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">📝 今日總單數</div>
            <div class="stat-value" id="val-orders">-</div>
        </div>
        <div class="stat-card success">
            <div class="stat-title">💰 已收營業額 (現金入袋)</div>
            <div class="stat-value" id="val-received">$-</div>
        </div>
        <div class="stat-card danger">
            <div class="stat-title">⚠️ 未收呆帳 (待結帳)</div>
            <div class="stat-value" id="val-unpaid">$-</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--warning);">
            <div class="stat-title">🔥 預估總營業額</div>
            <div class="stat-value" id="val-total" style="color: var(--warning);">$-</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <h2>💰 今日營收佔比</h2>
            <canvas id="revenueChart"></canvas>
        </div>

        <div class="panel">
            <h2>📃 最新訂單明細 (前 100 筆)</h2>
            <div style="max-height: 400px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>號碼牌</th>
                            <th>總金額</th>
                            <th>狀態</th>
                            <th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">
                        <tr><td colspan="5" class="loading">⏳ 正在連線至雲端資料庫...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 🎯 這裡換成您專屬的 Cloud Run 網址
        const API_BASE_URL = "https://whatthemeownews-erp-backend-324921111026.europe-west1.run.app";
        let revenueChartInstance = null;

        // 格式化時間的輔助函數
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        // 載入儀表板資料的主函數
        async function fetchDashboardData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = "⏳ 讀取中...";
            
            try {
                // 同時向大腦發送兩個問題：1.問今日統計 2.問歷史明細
                const [statsResponse, ordersResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/stats/today`),
                    fetch(`${API_BASE_URL}/api/orders`)
                ]);

                const statsResult = await statsResponse.json();
                const ordersResult = await ordersResponse.json();

                if (statsResult.status === 'success') {
                    updateStatsCards(statsResult.data);
                    updateChart(statsResult.data);
                }

                if (ordersResult.status === 'success') {
                    updateTable(ordersResult.data);
                }

            } catch (error) {
                console.error("連線錯誤:", error);
                alert("無法連線到雲端伺服器！請確認伺服器是否正常運作。");
            } finally {
                btn.textContent = "🔄 重新整理";
            }
        }

        // 更新頂部數字卡片
        function updateStatsCards(data) {
            const total = data.revenue_received + data.revenue_unpaid;
            
            // 加入動畫數字效果 (直接替換文字)
            document.getElementById('val-orders').textContent = data.total_orders_count;
            document.getElementById('val-received').textContent = `$${data.revenue_received.toLocaleString()}`;
            document.getElementById('val-unpaid').textContent = `$${data.revenue_unpaid.toLocaleString()}`;
            document.getElementById('val-total').textContent = `$${total.toLocaleString()}`;
        }

        // 更新最新訂單表格
        function updateTable(orders) {
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = ''; // 清空表格

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">目前還沒有任何訂單紀錄喔！</td></tr>';
                return;
            }

            orders.forEach(order => {
                const tr = document.createElement('tr');
                
                // 判斷狀態與標籤顏色
                const statusBadge = order.received 
                    ? `<span class="badge paid">✅ 已結帳</span>` 
                    : `<span class="badge unpaid">❌ 待結帳</span>`;

                tr.innerHTML = `
                    <td>${formatTime(order.created_at)}</td>
                    <td><strong>${order.order_no}</strong></td>
                    <td style="font-weight: bold; color: var(--danger);">$${order.total_amount}</td>
                    <td>${statusBadge}</td>
                    <td style="color: var(--text-muted);">${order.note || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 更新圓餅圖
        function updateChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            // 如果圖表已經存在，先銷毀它
            if (revenueChartInstance) {
                revenueChartInstance.destroy();
            }

            revenueChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['已收現金', '未收呆帳'],
                    datasets: [{
                        data: [data.revenue_received, data.revenue_unpaid],
                        backgroundColor: ['#4CAF50', '#f44336'],
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // 網頁一打開，立刻自動抓取資料
        window.onload = fetchDashboardData;

    </script>
</body>
</html>
