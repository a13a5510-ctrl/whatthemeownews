<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵逮雞 ERP - 旗艦戰情室</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4f46e5;     /* 靛藍色 */
            --primary-hover: #4338ca;
            --success: #10b981;     /* 翡翠綠 */
            --danger: #ef4444;      /* 珊瑚紅 */
            --warning: #f59e0b;     /* 琥珀金 */
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius-lg: 16px;
        }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            background: var(--card-bg);
            padding: 20px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px 0 rgba(79, 70, 229, 0.5); }
        .refresh-btn:active { transform: translateY(0); }

        /* --- 數據卡片區 --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
        
        /* 卡片頂部裝飾條 */
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        }
        .stat-card:nth-child(1)::before { background-color: var(--primary); }
        .stat-card:nth-child(2)::before { background-color: var(--success); }
        .stat-card:nth-child(3)::before { background-color: var(--danger); }
        .stat-card:nth-child(4)::before { background-color: var(--warning); }

        .stat-title {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value { font-size: 40px; font-weight: 900; margin: 0; line-height: 1.2; }
        .stat-card:nth-child(1) .stat-value { color: var(--primary); }
        .stat-card:nth-child(2) .stat-value { color: var(--success); }
        .stat-card:nth-child(3) .stat-value { color: var(--danger); }
        .stat-card:nth-child(4) .stat-value { color: var(--warning); }

        /* --- 圖表與表格區 --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex; align-items: center; gap: 10px;
        }

        /* --- 表格樣式 --- */
        .table-container { max-height: 400px; overflow-y: auto; border-radius: 8px; }
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background-color: #f8fafc; color: var(--text-muted); font-weight: 700;
            padding: 14px 16px; position: sticky; top: 0; z-index: 10;
            text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;
        }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr { transition: background-color 0.2s ease; }
        tr:hover { background-color: #f8fafc; }

        .badge {
            padding: 6px 12px; border-radius: 30px; font-size: 13px; font-weight: 700;
            display: inline-block; text-align: center; min-width: 70px;
        }
        .badge.paid { background-color: #d1fae5; color: #065f46; }
        .badge.unpaid { background-color: #fee2e2; color: #991b1b; }
        
        .loading { text-align: center; padding: 60px; font-size: 16px; color: var(--text-muted); font-weight: 600; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(79,70,229,0.3); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 喵逮雞 ERP 營運戰情室</h1>
        <button class="refresh-btn" onclick="fetchDashboardData()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            即時同步
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">📝 今日訂單總數</div>
            <div class="stat-value" id="val-orders">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">💰 實收現金 (已結帳)</div>
            <div class="stat-value" id="val-received">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">⚠️ 待收呆帳 (未結帳)</div>
            <div class="stat-value" id="val-unpaid">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">🔥 預估總營業額</div>
            <div class="stat-value" id="val-total">$0</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <h2>🍩 今日營收結構</h2>
            <div style="position: relative; height:300px; width:100%; display: flex; justify-content: center;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>📃 最新訂單動態 (TOP 100)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>號碼牌</th>
                            <th>金額</th>
                            <th>結帳狀態</th>
                            <th>備註/需求</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">
                        <tr><td colspan="5" class="loading"><div class="loading-spinner"></div>正在與總部伺服器連線...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 您的專屬 Cloud Run API
        const API_BASE_URL = "https://whatthemeownews-erp-backend-324921111026.europe-west1.run.app";
        let revenueChartInstance = null;

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        // 數字跳動動畫效果
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // 使用 easeOutQuart 讓動畫後面慢下來
                const easeProgress = 1 - Math.pow(1 - progress, 4);
                let currentVal = Math.floor(easeProgress * (end - start) + start);
                
                if (obj.id === 'val-orders') {
                    obj.innerHTML = currentVal;
                } else {
                    obj.innerHTML = `$${currentVal.toLocaleString()}`;
                }
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        async function fetchDashboardData() {
            const btn = document.querySelector('.refresh-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<div class="loading-spinner" style="width:14px;height:14px;border-width:2px;"></div>同步中...`;
            
            try {
                const [statsResponse, ordersResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/api/stats/today`),
                    fetch(`${API_BASE_URL}/api/orders`)
                ]);

                const statsResult = await statsResponse.json();
                const ordersResult = await ordersResponse.json();

                if (statsResult.status === 'success') {
                    updateStatsCards(statsResult.data);
                    updateChart(statsResult.data);
                }
                if (ordersResult.status === 'success') {
                    updateTable(ordersResult.data);
                }
            } catch (error) {
                console.error("連線錯誤:", error);
                alert("無法連線到雲端伺服器！");
            } finally {
                btn.innerHTML = originalHtml;
            }
        }

        function updateStatsCards(data) {
            const total = data.revenue_received + data.revenue_unpaid;
            
            // 取得當前數字做為動畫起點
            const getVal = (id) => parseInt(document.getElementById(id).textContent.replace(/[^0-9]/g, '')) || 0;

            animateValue(document.getElementById('val-orders'), getVal('val-orders'), data.total_orders_count, 1000);
            animateValue(document.getElementById('val-received'), getVal('val-received'), data.revenue_received, 1000);
            animateValue(document.getElementById('val-unpaid'), getVal('val-unpaid'), data.revenue_unpaid, 1000);
            animateValue(document.getElementById('val-total'), getVal('val-total'), total, 1000);
        }

        function updateTable(orders) {
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = ''; 

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="loading">今日尚無訂單，準備開市！</td></tr>';
                return;
            }

            orders.forEach(order => {
                const tr = document.createElement('tr');
                const statusBadge = order.received 
                    ? `<span class="badge paid">已結帳</span>` 
                    : `<span class="badge unpaid">待結帳</span>`;

                tr.innerHTML = `
                    <td style="color: var(--text-muted);">${formatTime(order.created_at)}</td>
                    <td><strong style="font-size:16px;">#${order.order_no}</strong></td>
                    <td><strong style="color: var(--text-main);">$${order.total_amount.toLocaleString()}</strong></td>
                    <td>${statusBadge}</td>
                    <td style="color: var(--text-muted); font-size: 14px;">${order.note || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            if (revenueChartInstance) revenueChartInstance.destroy();

            // 處理皆為 0 的情況避免圖表破圖
            const hasData = data.revenue_received > 0 || data.revenue_unpaid > 0;
            const chartData = hasData ? [data.revenue_received, data.revenue_unpaid] : [1];
            const chartColors = hasData ? ['#10b981', '#ef4444'] : ['#e2e8f0'];
            const chartLabels = hasData ? ['已收現金', '未收呆帳'] : ['尚無營收'];

            revenueChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: chartColors,
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%', // 讓甜甜圈更細緻
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { family: "'Nunito', sans-serif", size: 13 } } },
                        tooltip: { 
                            callbacks: { 
                                label: function(context) { 
                                    return hasData ? ` $${context.raw.toLocaleString()}` : ' $0'; 
                                } 
                            } 
                        }
                    }
                }
            });
        }

        window.onload = fetchDashboardData;
    </script>
</body>
</html>
