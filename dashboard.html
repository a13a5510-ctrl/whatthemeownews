<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵逮雞 ERP - 營運戰情室</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #f0f4f8; --card: #ffffff; --text: #1e293b; --text-muted: #64748b;
            --primary: #4f46e5; --primary-hover: #4338ca;
            --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="dark"] { 
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
            --primary: #6366f1; --primary-hover: #818cf8;
            --border: #334155; --success: #34d399; --danger: #f87171; --warning: #fbbf24;
        }

        body { font-family: 'Nunito', 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 24px; transition: all 0.3s ease; min-height: 100vh; box-sizing: border-box; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; background: var(--card); padding: 20px 32px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); flex-wrap: wrap; gap: 16px;}
        .header h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 900; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }
        .btn-theme { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-theme:hover { background: var(--border); }
        
        .btn-toggle-day { background: var(--warning); color: white; }
        .btn-toggle-day:hover { transform: translateY(-2px); opacity: 0.9; }

        .auto-refresh-toggle { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 16px; border-radius: 50px; border: 1px solid var(--border); font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        .auto-refresh-toggle.active { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .dot { width: 10px; height: 10px; background: var(--text-muted); border-radius: 50%; transition: 0.3s; }
        .auto-refresh-toggle.active .dot { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 32px; }
        .stat-card { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); position: relative; overflow: hidden; transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        .stat-card:nth-child(1)::before { background-color: var(--primary); }
        .stat-card:nth-child(2)::before { background-color: var(--success); }
        .stat-card:nth-child(3)::before { background-color: var(--danger); }
        .stat-card:nth-child(4)::before { background-color: var(--warning); }
        
        .stat-title { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 42px; font-weight: 900; margin: 0; line-height: 1.1; font-family: 'Nunito', sans-serif;}
        .stat-card:nth-child(1) .stat-value { color: var(--primary); }
        .stat-card:nth-child(2) .stat-value { color: var(--success); }
        .stat-card:nth-child(3) .stat-value { color: var(--danger); }
        .stat-card:nth-child(4) .stat-value { color: var(--warning); }

        .content-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        .panel { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .panel h2 { margin-top: 0; font-size: 18px; color: var(--text); margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

        .table-responsive { width: 100%; overflow-x: auto; max-height: 400px; overflow-y: auto; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px;}
        th { background: var(--bg); color: var(--text-muted); font-weight: 800; padding: 14px 16px; position: sticky; top: 0; z-index: 10; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border);}
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15px; color: var(--text); font-weight: 600;}
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(79, 70, 229, 0.03); }

        .badge { padding: 6px 12px; border-radius: 30px; font-size: 12px; font-weight: 800; display: inline-block; text-align: center; min-width: 60px; letter-spacing: 0.5px;}
        .badge.paid { background-color: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge.unpaid { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); }

        @media (max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .header { padding: 16px; flex-direction: column; align-items: flex-start; gap: 16px; }
            .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .header-actions .btn, .header-actions .auto-refresh-toggle { justify-content: center; width: 100%; box-sizing: border-box;}
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 16px;}
            .stat-value { font-size: 32px; }
            .panel { padding: 16px; }
        }

        body.simulate-mobile { max-width: 393px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 0 30px rgba(0,0,0,0.15); padding: 16px; }
        body.simulate-mobile .header { padding: 16px; flex-direction: column; align-items: flex-start; gap: 16px; }
        body.simulate-mobile .header h1 { font-size: 20px; }
        body.simulate-mobile .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        body.simulate-mobile .header-actions .btn, body.simulate-mobile .header-actions .auto-refresh-toggle { justify-content: center; width: 100%; padding: 10px 4px; font-size: 12px;}
        body.simulate-mobile .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
        body.simulate-mobile .stat-card { padding: 16px; }
        body.simulate-mobile .stat-title { font-size: 12px; }
        body.simulate-mobile .stat-value { font-size: 24px; }
        body.simulate-mobile .content-grid { grid-template-columns: 1fr; gap: 16px;}
        body.simulate-mobile .panel { padding: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">📊 喵逮雞 營運戰情室 (今日)</h1>
        <div class="header-actions">
            <button class="btn btn-toggle-day" id="dayToggleBtn" onclick="toggleDayView()">📅 查看昨日</button>
            
            <div class="auto-refresh-toggle" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                <div class="dot"></div> <span id="autoRefreshText">手動同步</span>
            </div>
            <button class="btn btn-primary" id="manualSyncBtn" onclick="fetchDashboardData()">🔄 立即同步</button>
            <button class="btn btn-theme" id="mobileToggleBtn" onclick="toggleMobileView()">📱 手機預覽</button>
            <button class="btn btn-theme" onclick="toggleTheme()">🌓 切換模式</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">📝 訂單總數</div>
            <div class="stat-value" id="val-orders">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">💰 實收現金 (已結帳)</div>
            <div class="stat-value" id="val-received">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">⚠️ 待收呆帳 (未結帳)</div>
            <div class="stat-value" id="val-unpaid">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">🔥 預估總營業額</div>
            <div class="stat-value" id="val-total">$0</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <h2>🍩 營收結構</h2>
            <div style="position: relative; height:300px; width:100%; display: flex; justify-content: center;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>
                📃 訂單動態明細
                <button class="btn btn-theme" style="padding: 6px 12px; font-size: 12px;" onclick="exportTableToCSV()">📥 匯出 Excel</button>
            </h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>號碼牌</th>
                            <th>金額</th>
                            <th>結帳狀態</th>
                            <th>備註/需求</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">
                        <tr><td colspan="5" style="text-align: center; padding: 40px;">正在與總部伺服器連線...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://whatthemeownews-erp-backend-324921111026.europe-west1.run.app";
        let revenueChartInstance = null;
        let autoRefreshInterval = null;
        let isAutoRefreshOn = false;
        
        // 🌟 核心：記錄目前觀看的日期模式 ('today' 或 'yesterday')
        let currentView = 'today'; 

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        // --- 🌟 切換日期模式 ---
        function toggleDayView() {
            if (currentView === 'today') {
                currentView = 'yesterday';
                document.getElementById('dayToggleBtn').textContent = '📅 返回今日';
                document.getElementById('pageTitle').textContent = '📊 喵逮雞 營運戰情室 (昨日)';
            } else {
                currentView = 'today';
                document.getElementById('dayToggleBtn').textContent = '📅 查看昨日';
                document.getElementById('pageTitle').textContent = '📊 喵逮雞 營運戰情室 (今日)';
            }
            fetchDashboardData(); // 切換後立刻去抓資料
        }

        function toggleTheme() {
            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            if(revenueChartInstance) {
                Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#64748b';
                revenueChartInstance.update();
            }
        }

        function toggleMobileView() {
            document.body.classList.toggle('simulate-mobile');
            document.getElementById('mobileToggleBtn').textContent = document.body.classList.contains('simulate-mobile') ? '💻 電腦模式' : '📱 手機預覽';
            if(revenueChartInstance) revenueChartInstance.resize();
        }

        function toggleAutoRefresh() {
            isAutoRefreshOn = !isAutoRefreshOn;
            const btn = document.getElementById('autoRefreshBtn');
            const text = document.getElementById('autoRefreshText');
            
            if (isAutoRefreshOn) {
                btn.classList.add('active');
                text.textContent = '即時同步中 (30s)';
                fetchDashboardData(); 
                autoRefreshInterval = setInterval(fetchDashboardData, 30000); 
            } else {
                btn.classList.remove('active');
                text.textContent = '手動同步';
                clearInterval(autoRefreshInterval);
            }
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 4);
                let currentVal = Math.floor(easeProgress * (end - start) + start);
                
                obj.innerHTML = obj.id === 'val-orders' ? currentVal : `$${currentVal.toLocaleString()}`;
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        async function fetchDashboardData() {
            const syncBtn = document.getElementById('manualSyncBtn');
            const originalText = syncBtn.innerHTML;
            syncBtn.innerHTML = `⏳ 抓取中...`;
            
            try {
                // 🌟 根據目前的 currentView，決定要呼叫哪個 API 通道
                const statsEndpoint = currentView === 'today' ? '/api/stats/today' : '/api/stats/yesterday';
                const ordersEndpoint = currentView === 'today' ? '/api/orders/today' : '/api/orders/yesterday';

                const [statsResponse, ordersResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}${statsEndpoint}`),
                    fetch(`${API_BASE_URL}${ordersEndpoint}`)
                ]);

                const statsResult = await statsResponse.json();
                const ordersResult = await ordersResponse.json();

                if (statsResult.status === 'success') {
                    const data = statsResult.data;
                    const total = data.revenue_received + data.revenue_unpaid;
                    const getVal = (id) => parseInt(document.getElementById(id).textContent.replace(/[^0-9]/g, '')) || 0;

                    animateValue(document.getElementById('val-orders'), getVal('val-orders'), data.total_orders_count, 1000);
                    animateValue(document.getElementById('val-received'), getVal('val-received'), data.revenue_received, 1000);
                    animateValue(document.getElementById('val-unpaid'), getVal('val-unpaid'), data.revenue_unpaid, 1000);
                    animateValue(document.getElementById('val-total'), getVal('val-total'), total, 1000);
                    updateChart(data);
                }

                if (ordersResult.status === 'success') {
                    const tbody = document.getElementById('order-table-body');
                    if (ordersResult.data.length === 0) {
                        const emptyMsg = currentView === 'today' ? '今日尚無訂單，準備開市！' : '昨日沒有訂單紀錄。';
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; opacity:0.6;">${emptyMsg}</td></tr>`;
                    } else {
                        tbody.innerHTML = ordersResult.data.map(order => `
                            <tr>
                                <td style="color: var(--text-muted);">${formatTime(order.created_at)}</td>
                                <td><strong style="font-size:16px;">#${order.order_no}</strong></td>
                                <td><strong style="color: var(--text);">$${order.total_amount.toLocaleString()}</strong></td>
                                <td>${order.received ? '<span class="badge paid">已結帳</span>' : '<span class="badge unpaid">待結帳</span>'}</td>
                                <td style="color: var(--text-muted); font-size: 14px;">${order.note || '-'}</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error("連線錯誤:", error);
            } finally {
                syncBtn.innerHTML = originalText;
            }
        }

        function updateChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            const hasData = data.revenue_received > 0 || data.revenue_unpaid > 0;
            const theme = document.body.getAttribute('data-theme');
            const emptyColor = theme === 'dark' ? '#334155' : '#e2e8f0';
            Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#64748b';

            if (revenueChartInstance) revenueChartInstance.destroy();

            revenueChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: hasData ? ['已收現金', '未收呆帳'] : ['尚無營收'],
                    datasets: [{
                        data: hasData ? [data.revenue_received, data.revenue_unpaid] : [1],
                        backgroundColor: hasData ? ['#10b981', '#ef4444'] : [emptyColor],
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%', 
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { family: "'Nunito', sans-serif", size: 13, weight: 'bold' } } },
                        tooltip: { callbacks: { label: function(context) { return hasData ? ` $${context.raw.toLocaleString()}` : ' $0'; } } }
                    }
                }
            });
        }

        function exportTableToCSV() {
            // 自動加上日期標籤
            const dateStr = currentView === 'today' ? '今日' : '昨日';
            const filename = `喵逮雞_${dateStr}訂單報表.csv`;

            const rows = document.querySelectorAll("table tr");
            let csv = [];
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                if(cols.length === 1) continue; 
                
                for (let j = 0; j < cols.length; j++) {
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").replace(/,/g, "，");
                    row.push('"' + data + '"');
                }
                csv.push(row.join(","));
            }
            
            let csvFile = new Blob(["\uFEFF" + csv.join("\n")], {type: "text/csv;charset=utf-8;"});
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        window.onload = fetchDashboardData;
    </script>
</body>
</html>
