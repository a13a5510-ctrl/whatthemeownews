<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喵逮雞 POS 系統</title>
    <!-- 連結您的樣式表 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">

    <!-- 1. 頂部訂單與總額狀態列 (還原深色橫幅) -->
    <div style="background-color: #333; color: white; display: flex; justify-content: space-around; padding: 15px; border-radius: 10px; margin: 10px;">
        <div style="text-align: center; font-size: 0.9rem; color: #aaa;">
            📅 今日訂單<br><span style="font-size: 1.5rem; color: #f1c40f; font-weight: bold;">0</span>
        </div>
        <div style="text-align: center; font-size: 0.9rem; color: #aaa;">
            💰 今日總額 (含未結帳)<br><span style="font-size: 1.5rem; color: #f1c40f; font-weight: bold;">$0</span>
        </div>
    </div>

    <!-- 2. 中央資訊區 (還原上下疊放) -->
    <div style="text-align: center; margin-bottom: 20px;">
        
        <!-- 圓形時鐘區塊 -->
        <div style="background-color: #3b3b4f; color: white; width: 120px; height: 120px; border-radius: 50%; display: inline-flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
            <div style="font-size: 0.9rem;">🕒 <span id="clock-year">2026</span></div>
            <div id="clock-date" style="font-size: 0.9rem;">年x月x日</div>
            <div id="clock-day" style="font-size: 0.9rem;">星期x</div>
            <div id="clock-time" style="font-size: 1.3rem; color: #66b3ff; font-weight: bold; margin-top: 5px;">00:00</div>
        </div>
        
        <br>
        
        <!-- 喵逮雞 Logo -->
        <img src="IMG_1673.PNG" alt="喵逮雞 Logo" style="width: 80px; height: 80px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); margin-bottom: 15px;">
        
        <br>
        
        <!-- 功能按鈕列 -->
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button id="calc-btn" class="btn" style="background-color: #e67e22; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9rem; font-weight: bold;"><i class="fas fa-calculator"></i> 計算機</button>
            <button id="refresh-menu-btn" class="btn" style="background-color: #3b5998; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9rem; font-weight: bold;"><i class="fas fa-sync-alt"></i> 更新菜單</button>
            <button id="theme-toggle" class="btn" style="background-color: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9rem; font-weight: bold;">[ 深色模式 ]</button>
        </div>

    </div>

    <!-- 3. 主要訂單表格區 -->
    <main style="padding: 0 10px;">
        <div class="table-responsive">
            <table id="order-table" class="pos-table" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr id="header-row">
                        <!-- 表頭將由 app.js 自動平鋪生成 (還原經典藍底白字) -->
                    </tr>
                </thead>
                <tbody id="order-body">
                    <!-- 10個訂單列由 JS 動態產生 -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- 連結您的 JavaScript 邏輯 -->
    <script src="app.js"></script>
</body>
</html>
